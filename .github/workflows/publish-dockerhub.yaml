name: Build and Push Docker Images

env:
  DOCKERHUB_USERNAME: lopin

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'images/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: images/alpine-xcalc
            image_name: alpine-xcalc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Check for changes in app directory
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - '${{ matrix.app_dir }}/**'

      - name: Set Short SHA
        if: steps.check.outputs.changed == 'true'
        id: vars
        run: printf 'sha_short=%.7s\n' ${{ github.sha }} >> ${GITHUB_OUTPUT}

      - name: Log in to Docker Hub
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app_dir }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ steps.vars.outputs.sha_short }}
